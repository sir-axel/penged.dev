# Test-only copy of wrangler.toml with the optional R2 binding enabled (generated by hand; keep in sync).
name = "penged"
main = "src/worker.js"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# One Worker serves the built web app (static assets) and the API. Only /api/* runs Worker code.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "penged"
database_id = "00000000-0000-0000-0000-000000000000" # local test DB only (never remote)
migrations_dir = "migrations"

# Avatars: stored in D1 (200KB cap) by default. To store them in R2 instead (2MB cap; R2 may need a payment
# method), create the bucket (`wrangler r2 bucket create penged-avatars`) and uncomment:
[[r2_buckets]]
binding = "AVATARS"
bucket_name = "penged-avatars"

# Expire overdue challenges/matches and refresh flags every 15 minutes.
[triggers]
crons = ["*/15 * * * *"]

[observability]
enabled = true

# [vars] (all optional)
#   BETTER_AUTH_URL  public site origin; when unset it is derived from each request's origin
#   TRUSTED_ORIGINS  comma-separated extra origins allowed for auth/CORS (the base URL is always trusted)
# Secrets (`wrangler secret put`, or api/.dev.vars locally): BETTER_AUTH_SECRET
